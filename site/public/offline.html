<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2f5c">
<title>Offline · Birth of the King</title>
<style>
  :root { --navy:#1f2f5c; --gold:#c9a24a; --soft:#efe2bf; --night:#141b30; }
  html,body { margin:0; min-height:100%; background:var(--night); color:#fff; font-family: Georgia, "Times New Roman", serif; }
  main { min-height:100svh; display:flex; flex-direction:column; justify-content:center; padding: 32px max(16px, 6vw); box-sizing:border-box; max-width:640px; margin:0 auto; }
  .k { font: 800 12px/1 system-ui, sans-serif; letter-spacing:.26em; text-transform:uppercase; color:var(--gold); }
  h1 { font: 900 clamp(40px, 10vw, 64px)/0.98 system-ui, sans-serif; text-transform:uppercase; margin:12px 0 0; }
  .bar { width:80px; height:4px; background:var(--gold); margin:18px 0; }
  p { font-size:18px; line-height:1.6; color:#e8e3d4; }
  a { display:inline-flex; align-items:center; min-height:48px; padding:0 24px; border-radius:999px; background:var(--gold); color:var(--navy); font:800 16px system-ui, sans-serif; text-decoration:none; margin-top:12px; width:fit-content; }
</style>
</head>
<body>
<main>
  <div class="k">You’re offline</div>
  <h1>Birth of<br>the King</h1>
  <div class="bar"></div>
  <p>This page hasn’t been saved on this device yet. Lessons you have already opened still work without a signal.</p>
  <p>“For unto us a child is born, unto us a son is given.” <b>(Isaiah 9:6)</b></p>
  <a href="/lessons">Open my lessons</a>
</main>
</body>
</html>
