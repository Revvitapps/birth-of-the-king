<title>Beyond the Manger</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a dark reading-table backdrop with the open book centered and a slim toolbar below.
   The viewer keeps only the two pages in view on screen. A page turn is a flat (2D) fold of one
   extra panel, so it stays smooth on big and full screen displays. No 3D layers, no web fonts. */
:root{
  --table:#141b30; --table2:#0d1222; --ink:#efe6cf; --muted:#a9a38f; --gold:#c9a24a; --line:rgba(201,162,74,.28);
  --display:Georgia, "Times New Roman", serif;
  --ui:system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--table2);color:var(--ink);font-family:var(--ui);
  overflow:hidden;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:14px 6px;flex-wrap:wrap}
header h1{font-family:var(--display);font-weight:600;font-size:clamp(20px,2.4vw,28px);letter-spacing:.02em;margin:0;color:var(--ink)}
header .hint{font-size:12px;color:var(--muted);letter-spacing:.02em}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#book{position:relative;flex:none;touch-action:pan-y;cursor:pointer}
.slot,#turn{position:absolute;top:0;width:50%;height:100%;overflow:hidden;background:#fbf8f1}
.slot.l{left:0}.slot.r{left:50%}
.slot img,#turn img{display:block;width:100%;height:100%;max-width:none;user-select:none;-webkit-user-drag:none;pointer-events:none}
.slot[hidden],#turn[hidden]{display:none}
/* gutter shading so the spread reads as bound paper */
.slot.l::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(270deg,rgba(0,0,0,.2),rgba(0,0,0,.05) 4%,transparent 10%)}
.slot.r::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.2),rgba(0,0,0,.05) 4%,transparent 10%)}
#book.one .slot::after{background:none}
#turn{z-index:2}
#turn::after{content:"";position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
#turn.dim::after{opacity:.22;transition:opacity .2s linear}
/* narrow screens: one page at a time */
#book.single .slot.l{display:none}
#book.single .slot.r,#book.single #turn{left:0;width:100%}
nav{display:flex;align-items:center;justify-content:center;gap:10px;padding-block:8px max(14px,env(safe-area-inset-bottom,0px));flex-wrap:wrap}
button,select{font:500 13px var(--ui);color:var(--ink);background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:999px;padding:8px 16px;cursor:pointer}
button:hover,select:hover{border-color:var(--gold)}
button:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.35;cursor:default}
select{appearance:none;-webkit-appearance:none}
select option{background:#141b30;color:var(--ink)}
#pg{font:500 13px var(--ui);color:var(--muted);min-width:130px;text-align:center;font-variant-numeric:tabular-nums}
body.fs header{display:none}
body.fs #stage{padding-top:10px}
body.narrow header .hint{display:none}
body.narrow nav::after{content:"Tap the right side of the page or swipe to turn it";flex-basis:100%;text-align:center;font-size:12px;color:var(--muted)}
</style>

<header>
  <h1>Beyond the Manger</h1>
  <span class="hint">Click a page or use the ← → keys to turn it.</span>
</header>
<div id="stage">
  <div id="book" aria-label="Flip book">
    <div class="slot l"><img id="imL" alt="" decoding="sync"></div>
    <div class="slot r"><img id="imR" alt="" decoding="sync"></div>
    <div id="turn" hidden><img id="imT" alt="" decoding="sync"></div>
  </div>
</div>
<nav>
  <button id="prev" aria-label="Previous page">← Back</button>
  <span id="pg" aria-live="polite"></span>
  <button id="next" aria-label="Next page">Turn page →</button>
  <button id="fs" aria-label="Full screen" hidden>⛶ Full screen</button>
  <select id="jump" aria-label="Go to section">
    <option value="1">Cover</option>
    <option value="5">How to Use This Book</option>
    <option value="6">Contents</option>
    <option value="8">Lesson 1 · The Promised King</option>
    <option value="16">Lesson 2 · The Announcement</option>
    <option value="28">Lesson 3 · The Lamb in the Manger</option>
    <option value="46">Lesson 4 · Forty Days Old</option>
    <option value="60">Lesson 5 · Wise Men from the East</option>
    <option value="76">Lesson 6 · Gifts for the King</option>
    <option value="90">Lesson 7 · Out of Egypt, Home to Nazareth</option>
    <option value="107">Answer Key</option>
    <option value="110">Back Cover</option>
  </select>
</nav>

<script>
(function(){
  var N = 110, L = Math.ceil(N/2), RATIO = 11/8.5, HALF = 190; // ms for each half of a turn
  var $ = function(id){ return document.getElementById(id); };
  var book = $('book'), stage = $('stage'), turn = $('turn');
  var slotL = book.querySelector('.slot.l'), slotR = book.querySelector('.slot.r');
  var imL = $('imL'), imR = $('imR'), imT = $('imT');
  var src = function(n){ return 'pages/p' + String(n).padStart(3,'0') + '.jpg'; };
  // cur = spread number in two-page mode: spread k shows pages 2k (left) and 2k+1 (right).
  // single = page number in one-page mode.
  var cur = 0, single = 1, narrow = false, busy = false, queued = 0;
  var canAnimate = !!turn.animate && !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

  // keep a handful of nearby pages loaded so a turn never waits on the disk
  var cache = {};
  function warm(){
    var c = narrow ? single : 2*cur, keep = {};
    for (var n = c-4; n <= c+7; n++){ if (n < 1 || n > N) continue; keep[n] = 1;
      if (!cache[n]){ var im = new Image(); im.decoding = 'async'; im.src = src(n); cache[n] = im; } }
    for (var k in cache) if (!keep[k]) delete cache[k];
  }
  function set(img, n){ var u = src(n); if (img.getAttribute('src') !== u){ img.src = u; img.alt = 'Page ' + n; } }
  function leftPage(k){ return k >= 1 ? 2*k : 0; }
  function rightPage(k){ return 2*k+1 <= N ? 2*k+1 : 0; }

  // draw the resting state for the current position
  function paint(){
    if (narrow){ slotR.hidden = false; set(imR, single); book.classList.add('one'); book.style.transform = ''; return; }
    var l = leftPage(cur), r = rightPage(cur);
    slotL.hidden = !l; slotR.hidden = !r;
    if (l) set(imL, l); if (r) set(imR, r);
    book.classList.toggle('one', !l || !r);
    book.style.transform = !l ? 'translateX(-25%)' : !r ? 'translateX(25%)' : '';
  }
  function label(){
    var t;
    if (narrow) t = 'Page ' + single + ' of ' + N;
    else if (cur === 0) t = 'Cover';
    else if (cur === L) t = 'Back cover';
    else t = 'Pages ' + (2*cur) + '–' + (2*cur+1) + ' of ' + N;
    $('pg').textContent = t;
    $('prev').disabled = narrow ? single === 1 : cur === 0;
    $('next').disabled = narrow ? single === N : cur === L;
    var pageNow = narrow ? single : Math.max(1, 2*cur), sel = $('jump'), best = sel.options[0].value;
    for (var i = 0; i < sel.options.length; i++){ if (+sel.options[i].value <= pageNow) best = sel.options[i].value; }
    sel.value = best;
    try { localStorage.setItem('botk-page', String(pageNow)); } catch(e){}
  }
  function settle(){ turn.hidden = true; turn.classList.remove('dim'); turn.style.transform = ''; paint(); label(); warm(); busy = false;
    if (queued){ var d = queued; queued = 0; step(d); } }

  // one half of a fold: the panel squeezes toward (or opens from) the spine
  function fold(side, origin, from, to, easing, done){
    turn.style.left = narrow ? '0' : (side === 'r' ? '50%' : '0');
    turn.style.transformOrigin = origin + ' center';
    turn.hidden = false;
    var a = turn.animate([{transform:'scaleX(' + from + ')'}, {transform:'scaleX(' + to + ')'}], {duration:HALF, easing:easing, fill:'forwards'});
    var fired = false, fin = function(){ if (fired) return; fired = true; try { a.cancel(); } catch(e){} done(); };
    a.onfinish = fin; setTimeout(fin, HALF + 120); // safety net if the animation event never arrives
  }

  function step(dir){ // dir = +1 forward, -1 back
    if (busy){ queued = dir; return; }
    if (narrow){
      var p = single + dir; if (p < 1 || p > N) return;
      if (!canAnimate){ single = p; cur = Math.floor(p/2); return settle(); }
      busy = true;
      if (dir > 0){ set(imT, single); turn.hidden = false; single = p; set(imR, p); turn.classList.add('dim'); fold('r', 'left', 1, 0, 'ease-in', settle); }
      else { set(imT, p); single = p; fold('r', 'left', 0, 1, 'ease-out', settle); }
      cur = Math.floor(single/2); return;
    }
    var t = cur + dir; if (t < 0 || t > L) return;
    if (!canAnimate){ cur = t; return settle(); }
    busy = true;
    var from = cur; cur = t;
    if (dir > 0){
      // the right page folds to the spine, then its back opens out over the left side
      set(imT, rightPage(from)); turn.style.left = '50%'; turn.hidden = false;
      if (rightPage(t)) { slotR.hidden = false; set(imR, rightPage(t)); } else slotR.hidden = true;
      turn.classList.add('dim');
      fold('r', 'left', 1, 0, 'ease-in', function(){
        turn.hidden = true; turn.classList.remove('dim'); set(imT, leftPage(t));
        fold('l', 'right', 0, 1, 'ease-out', settle);
      });
    } else {
      set(imT, leftPage(from)); turn.style.left = '0'; turn.hidden = false;
      if (leftPage(t)) { slotL.hidden = false; set(imL, leftPage(t)); } else slotL.hidden = true;
      turn.classList.add('dim');
      fold('l', 'right', 1, 0, 'ease-in', function(){
        turn.hidden = true; turn.classList.remove('dim'); set(imT, rightPage(t));
        fold('r', 'left', 0, 1, 'ease-out', settle);
      });
    }
    warm();
  }
  function goPage(p){ // jump straight to a page, no animation
    if (busy) return;
    p = Math.max(1, Math.min(N, p)); single = p; cur = Math.min(L, Math.floor(p/2)); settle();
  }

  var lw = 0, lh = 0;
  function layout(){
    var w = stage.clientWidth, h = stage.clientHeight - 8;
    if (w === lw && h === lh) return; lw = w; lh = h;
    var was = narrow; narrow = w < 620 && h > w;
    document.body.classList.toggle('narrow', narrow); book.classList.toggle('single', narrow);
    var pw = Math.floor(narrow ? Math.min(w, h / RATIO) : Math.min(w / 2, h / RATIO));
    book.style.width = (narrow ? pw : pw*2) + 'px'; book.style.height = Math.round(pw*RATIO) + 'px';
    if (was !== narrow){ if (narrow) single = Math.max(1, 2*cur); else cur = Math.min(L, Math.floor(single/2)); slotL.hidden = false; }
    if (!busy){ paint(); label(); warm(); }
  }

  $('prev').onclick = function(){ step(-1); };
  $('next').onclick = function(){ step(1); };
  $('jump').onchange = function(e){ goPage(+e.target.value); e.target.blur(); };
  book.addEventListener('click', function(e){
    var r = book.getBoundingClientRect(), x = (e.clientX - r.left) / r.width;
    if (narrow) step(x < 1/3 ? -1 : 1);
    else if (cur === 0) step(1); else if (cur === L) step(-1); else step(x < .5 ? -1 : 1);
  });
  document.addEventListener('keydown', function(e){
    if (e.target.tagName === 'SELECT' || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); step(1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); step(-1); }
    else if (e.key === 'Home') goPage(1); else if (e.key === 'End') goPage(N);
  });
  var sx = null, sy = null;
  stage.addEventListener('touchstart', function(e){ sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive:true});
  stage.addEventListener('touchend', function(e){
    if (sx === null) return; var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) { e.preventDefault(); step(dx < 0 ? 1 : -1); }
  });

  // full screen: shown only where the browser allows it (iPhones do not)
  var fsBtn = $('fs'), root = document.documentElement;
  var fsReq = root.requestFullscreen || root.webkitRequestFullscreen;
  var fsExit = document.exitFullscreen || document.webkitExitFullscreen;
  var fsOn = function(){ return document.fullscreenElement || document.webkitFullscreenElement; };
  if (fsReq && (document.fullscreenEnabled || document.webkitFullscreenEnabled)){
    fsBtn.hidden = false;
    var fsToggle = function(){ try { var r = fsOn() ? fsExit.call(document) : fsReq.call(root); if (r && r.catch) r.catch(function(){}); } catch(e){} };
    fsBtn.onclick = function(){ fsToggle(); fsBtn.blur(); };
    var fsSync = function(){ var on = !!fsOn(); fsBtn.textContent = on ? '✕ Exit full screen' : '⛶ Full screen'; document.body.classList.toggle('fs', on); layout(); };
    document.addEventListener('fullscreenchange', fsSync); document.addEventListener('webkitfullscreenchange', fsSync);
    document.addEventListener('keydown', function(e){ if ((e.key === 'f' || e.key === 'F') && e.target.tagName !== 'SELECT' && !e.ctrlKey && !e.metaKey && !e.altKey) fsToggle(); });
  }
  // re-measure whenever the stage changes size (window resize, entering or leaving full screen)
  if (window.ResizeObserver) new ResizeObserver(function(){ layout(); }).observe(stage);
  window.addEventListener('resize', layout);

  var saved = 1; try { saved = parseInt(localStorage.getItem('botk-page') || '1', 10) || 1; } catch(e){}
  saved = Math.max(1, Math.min(N, saved)); single = saved; cur = Math.min(L, Math.floor(saved/2));
  layout();
})();
</script>
