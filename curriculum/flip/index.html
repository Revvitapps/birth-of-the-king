<title>Birth of the King</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: a reading-table backdrop with the open book centered; a slim toolbar below. Single dark look by choice. */
:root{
  --table:#141b30; --table2:#0d1222; --ink:#efe6cf; --muted:#a9a38f; --gold:#c9a24a; --line:rgba(201,162,74,.28);
  --display:"Cormorant Garamond", Georgia, "Times New Roman", serif;
  --ui:Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 90% at 50% 40%,var(--table),var(--table2));color:var(--ink);font-family:var(--ui);
  overflow:hidden;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:14px 6px;flex-wrap:wrap}
header h1{font-family:var(--display);font-weight:600;font-size:clamp(20px,2.4vw,28px);letter-spacing:.02em;margin:0;color:var(--ink)}
header .hint{font-size:12px;color:var(--muted);letter-spacing:.02em}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;perspective:2600px}
#book{position:relative;transition:transform .8s cubic-bezier(.4,.1,.2,1)}
#book::before{content:"";position:absolute;inset:6% -1% -3% -1%;background:rgba(0,0,0,.45);filter:blur(22px);z-index:-1;border-radius:6px;transition:inset .8s}
#book.closed-front::before{inset:6% -1% -3% 50%}
#book.closed-back::before{inset:6% 50% -3% -1%}
.leaf{position:absolute;top:0;left:50%;width:50%;height:100%;transform-origin:left center;transform-style:preserve-3d;
  transition:transform .9s cubic-bezier(.45,.05,.25,1);cursor:pointer}
.leaf.flipped{transform:rotateY(-180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;background:#fbf8f1}
.face img{display:block;width:100%;height:100%;object-fit:cover;max-width:none;user-select:none;-webkit-user-drag:none;pointer-events:none}
.face.back{transform:rotateY(180deg)}
/* gutter shading so the spread reads as bound paper */
.face.front::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.22),rgba(0,0,0,.06) 4%,transparent 10%)}
.face.back::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(270deg,rgba(0,0,0,.22),rgba(0,0,0,.06) 4%,transparent 10%)}
.face.cover::after,.face.backcover::after{background:none}
.leaf.moving .face::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;animation:sheen .9s ease-in-out}
@keyframes sheen{0%{background:rgba(0,0,0,0)}50%{background:rgba(0,0,0,.18)}100%{background:rgba(0,0,0,0)}}
.face .ph{position:absolute;inset:0;display:grid;place-items:center;color:#b9ae90;font:500 13px var(--ui)}
nav{display:flex;align-items:center;justify-content:center;gap:10px;padding-block:8px max(14px,env(safe-area-inset-bottom,0px));flex-wrap:wrap}
button,select{font:500 13px var(--ui);color:var(--ink);background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:999px;padding:8px 16px;cursor:pointer}
button:hover,select:hover{border-color:var(--gold)}
button:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.35;cursor:default}
select{appearance:none;padding-right:16px;background:rgba(255,255,255,.04)}
select option{background:#141b30;color:var(--ink)}
#pg{font:500 13px var(--ui);color:var(--muted);min-width:130px;text-align:center;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){.leaf,#book{transition:none}.leaf.moving .face::before{animation:none}}
/* single-page mode for narrow screens */
#single{display:none;position:relative;box-shadow:0 18px 40px rgba(0,0,0,.5);background:#fbf8f1;perspective:1600px;touch-action:pan-y}
#single img{position:absolute;inset:0;display:block;width:100%;height:100%;max-width:none;user-select:none;-webkit-user-drag:none}
#simg{transform-origin:left center;transition:transform .6s cubic-bezier(.45,.05,.25,1),filter .6s;box-shadow:0 0 0 rgba(0,0,0,0);backface-visibility:hidden;-webkit-backface-visibility:hidden}
#simg.turned{transform:rotateY(-110deg);filter:brightness(.6)}
#simg.instant{transition:none}
body.narrow #book{display:none}
body.narrow #single{display:block}
body.narrow header .hint{display:none}
body.narrow nav::after{content:"Tap the right side of the page or swipe to turn it";flex-basis:100%;text-align:center;font-size:12px;color:var(--muted)}
</style>

<header>
  <h1>Birth of the King</h1>
  <span class="hint">Click a page or use the ← → keys to turn it.</span>
</header>
<div id="stage">
  <div id="book" aria-label="Flip book"></div>
  <div id="single" aria-label="Book page"><img id="sunder" alt=""><img id="simg" alt=""></div>
</div>
<nav>
  <button id="prev" aria-label="Previous page">← Back</button>
  <span id="pg" aria-live="polite"></span>
  <button id="next" aria-label="Next page">Turn page →</button>
  <select id="jump" aria-label="Go to section">
    <option value="1">Cover</option>
    <option value="3">How to Use This Book</option>
    <option value="4">Contents</option>
    <option value="6">Lesson 1 · The Promised King</option>
    <option value="32">Lesson 2 · A King Is Born</option>
    <option value="48">Lesson 3 · Star in the Sky</option>
    <option value="64">Lesson 4 · The Wise Men Worship</option>
    <option value="82">Lesson 5 · Escape to Egypt</option>
    <option value="99">Answer Key</option>
    <option value="102">Back Cover</option>
  </select>
</nav>

<script>
(function(){
  var N = 102, L = Math.ceil(N/2), RATIO = 10/7;
  var book = document.getElementById('book'), stage = document.getElementById('stage');
  var src = function(n){ return 'pages/p' + String(n).padStart(3,'0') + '.jpg'; };
  var leaves = [], imgs = {}, cur = 0, single = 1, narrow = false;

  function face(n, cls){
    var f = document.createElement('div'); f.className = 'face ' + cls;
    if (n === 1) f.className += ' cover'; if (n === N) f.className += ' backcover';
    if (n <= N){ var ph = document.createElement('div'); ph.className='ph'; ph.textContent='Page ' + n; f.appendChild(ph);
      var im = document.createElement('img'); im.alt = 'Page ' + n; im.decoding='async'; im.onload=function(){ph.remove();}; f.appendChild(im); imgs[n] = im; }
    return f;
  }
  for (var k = 0; k < L; k++){
    var lf = document.createElement('div'); lf.className = 'leaf';
    lf.appendChild(face(2*k+1, 'front')); lf.appendChild(face(2*k+2, 'back'));
    (function(k){ lf.addEventListener('click', function(){ go(k < cur ? cur-1 : cur+1); }); })(k);
    book.appendChild(lf); leaves.push(lf);
  }

  function want(n){ if (n>=1 && n<=N && imgs[n] && !imgs[n].src) imgs[n].src = src(n); }
  function preload(){
    if (narrow){ for (var i=single-2;i<=single+3;i++) want(i); return; }
    for (var p = 2*cur-3; p <= 2*cur+6; p++) want(p);
  }
  function stack(){
    leaves.forEach(function(lf, k){
      if (lf.classList.contains('moving')) return;
      lf.style.zIndex = k < cur ? (k+1) : (L-k);
    });
  }
  function shift(){
    book.classList.toggle('closed-front', cur === 0);
    book.classList.toggle('closed-back', cur === L);
    book.style.transform = cur === 0 ? 'translateX(-25%)' : cur === L ? 'translateX(25%)' : 'none';
  }
  function label(){
    var t;
    if (narrow) t = 'Page ' + single + ' of ' + N;
    else if (cur === 0) t = 'Cover';
    else if (cur === L) t = 'Back cover';
    else t = 'Pages ' + (2*cur) + '–' + (2*cur+1) + ' of ' + N;
    document.getElementById('pg').textContent = t;
    var atStart = narrow ? single===1 : cur===0, atEnd = narrow ? single===N : cur===L;
    document.getElementById('prev').disabled = atStart;
    document.getElementById('next').disabled = atEnd;
    var pageNow = narrow ? single : Math.max(1, 2*cur), sel = document.getElementById('jump'), best = sel.options[0].value;
    for (var i=0;i<sel.options.length;i++){ if (+sel.options[i].value <= pageNow) best = sel.options[i].value; }
    sel.value = best;
    try { localStorage.setItem('botk-page', String(pageNow)); } catch(e){}
  }

  function go(target, fast){
    if (narrow) return goSingle(target <= cur ? single-1 : single+1);
    target = Math.max(0, Math.min(L, target));
    if (target === cur) return;
    var fwd = target > cur, from = cur, steps = Math.abs(target-from);
    var dur = steps > 1 ? 0.55 : 0.9;
    for (var s = 0; s < steps; s++){
      var k = fwd ? from + s : from - 1 - s;
      (function(lf, s){
        lf.classList.add('moving');
        lf.style.transitionDuration = dur + 's';
        lf.style.transitionDelay = (s * 0.07) + 's';
        lf.style.zIndex = 500 + (fwd ? s : steps - s) + (fwd ? 0 : 0);
        lf.classList.toggle('flipped', fwd);
        setTimeout(function(){ lf.classList.remove('moving'); lf.style.transitionDelay=''; lf.style.transitionDuration=''; stack(); }, (dur + s*0.07)*1000 + 30);
      })(leaves[k], s);
    }
    cur = target; preload(); shift(); label();
  }
  function goPage(p){ // page number → spread
    if (narrow) return goSingle(p);
    go(Math.floor(p/2));
  }

  // single-page mode
  var simg = document.getElementById('simg');
  var sunder = document.getElementById('sunder'), busy = false;
  function goSingle(p){
    p = Math.max(1, Math.min(N, p)); if (busy || (p === single && simg.src)) return;
    var fwd = p > single; single = p; busy = true;
    if (fwd){
      sunder.src = src(p); simg.classList.remove('instant'); simg.classList.add('turned');
      setTimeout(function(){ simg.classList.add('instant'); simg.src = src(p); simg.classList.remove('turned'); void simg.offsetWidth; simg.classList.remove('instant'); busy = false; }, 620);
    } else {
      sunder.src = simg.src; simg.classList.add('instant'); simg.classList.add('turned'); simg.src = src(p); void simg.offsetWidth;
      simg.classList.remove('instant'); requestAnimationFrame(function(){ simg.classList.remove('turned'); });
      setTimeout(function(){ sunder.src = src(p); busy = false; }, 640);
    }
    simg.alt = 'Page ' + p;
    cur = Math.floor(p/2); preload(); label();
  }

  function layout(){
    var w = stage.clientWidth, h = stage.clientHeight - 8;
    var wasNarrow = narrow;
    narrow = w < 620 && h > w;
    document.body.classList.toggle('narrow', narrow);
    if (narrow){
      var pw = Math.min(w, h / RATIO); var sg = document.getElementById('single');
      sg.style.width = pw + 'px'; sg.style.height = (pw*RATIO) + 'px';
      if (!wasNarrow){ single = Math.max(1, cur === 0 ? 1 : 2*cur); simg.src = src(single); sunder.src = src(single); }
    } else {
      var pw2 = Math.min(w / 2, h / RATIO);
      book.style.width = (pw2*2) + 'px'; book.style.height = (pw2*RATIO) + 'px';
      if (wasNarrow){ var t = Math.floor(single/2); leaves.forEach(function(lf,k){ lf.style.transition='none'; lf.classList.toggle('flipped', k < t); }); cur = t; void book.offsetWidth; leaves.forEach(function(lf){ lf.style.transition=''; }); stack(); shift(); }
    }
    preload(); label();
  }

  document.getElementById('prev').onclick = function(){ narrow ? goSingle(single-1) : go(cur-1); };
  document.getElementById('next').onclick = function(){ narrow ? goSingle(single+1) : go(cur+1); };
  document.getElementById('jump').onchange = function(e){ goPage(+e.target.value); };
  document.addEventListener('keydown', function(e){
    if (e.target.tagName === 'SELECT') return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); document.getElementById('next').click(); }
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); document.getElementById('prev').click(); }
    if (e.key === 'Home') goPage(1); if (e.key === 'End') goPage(N);
  });
  var sx = null, sy = null;
  stage.addEventListener('touchstart', function(e){ sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive:true});
  stage.addEventListener('touchend', function(e){
    if (sx === null) return; var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) { e.preventDefault(); (dx < 0 ? document.getElementById('next') : document.getElementById('prev')).click(); }
  });
  document.getElementById('single').addEventListener('click', function(e){
    var r = this.getBoundingClientRect(); (e.clientX - r.left < r.width/3 ? document.getElementById('prev') : document.getElementById('next')).click();
  });

  window.addEventListener('resize', layout);
  stack(); shift(); layout();
  var saved = 1; try { saved = parseInt(localStorage.getItem('botk-page') || '1', 10) || 1; } catch(e){}
  if (saved > 1){
    var t = narrow ? 0 : Math.floor(saved/2);
    if (narrow) goSingle(saved);
    else { leaves.forEach(function(lf,k){ lf.style.transition='none'; lf.classList.toggle('flipped', k < t); }); cur = t; void book.offsetWidth; leaves.forEach(function(lf){ lf.style.transition=''; }); stack(); shift(); preload(); label(); }
  }
})();
</script>
